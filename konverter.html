<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Лира · Доллар · Рубль</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#14201c;--muted:#6b7a75;--line:#dde4e1;--accent:#0f766e;--accent-soft:#e3f2ef}
@media (prefers-color-scheme:dark){:root{--bg:#0e1412;--card:#18211e;--text:#e8efec;--muted:#8fa19b;--line:#2a3632;--accent:#2dd4bf;--accent-soft:#16302b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{height:100vh;height:100dvh;max-width:460px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:18px;margin:0}
.info{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fields{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;min-height:0}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.row:focus-within{border-color:var(--accent);background:var(--accent-soft)}
.cur{min-width:52px}.cur b{display:block;font-size:20px}.cur span{font-size:11px;color:var(--muted)}
.row input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:26px;font-weight:600;text-align:right;outline:none;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px}
.chips button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 0;font-size:13px}
.chips button:active{background:var(--accent-soft)}
.rates{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rates .head,.rates .line{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;align-items:center}
.rates .head{font-size:11px;color:var(--muted);margin-bottom:6px}
.rates .line+.line{margin-top:6px}
.pair{font-size:13px;color:var(--muted)}
.cell{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--text);width:100%;min-width:0}
input.cell{outline:none}
.cell.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.cell.off{opacity:.45}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 0}
</style>
</head>
<body>
<main>
  <header><h1>₺ · $ · ₽</h1><div class="info" id="info"></div></header>

  <div class="fields">
    <div class="row"><div class="cur"><b>₺</b><span>лира</span></div><input id="TRY" inputmode="decimal" placeholder="0"></div>
    <div class="row"><div class="cur"><b>$</b><span>доллар</span></div><input id="USD" inputmode="decimal" placeholder="0"></div>
    <div class="row"><div class="cur"><b>₽</b><span>рубль</span></div><input id="RUB" inputmode="decimal" placeholder="0"></div>
    <div class="chips">
      <button data-v="100">₺100</button><button data-v="500">₺500</button>
      <button data-v="1000">₺1000</button><button data-v="5000">₺5000</button>
      <button id="clear">✕</button>
    </div>
  </div>

  <section class="rates">
    <div class="head"><span></span><span>Сегодня</span><span>Обменник</span></div>
    <div class="line"><span class="pair">1 $ = ₺</span><div class="cell" id="mTRY"></div><input class="cell" id="oTRY" inputmode="decimal" placeholder="—"></div>
    <div class="line"><span class="pair">1 $ = ₽</span><div class="cell" id="mRUB"></div><input class="cell" id="oRUB" inputmode="decimal" placeholder="—"></div>
    <div class="foot"><span id="stamp"></span><button id="resetO">Сбросить обменник</button></div>
  </section>
</main>
<script>
var el=function(id){return document.getElementById(id)};
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v||d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function parse(v){v=String(v).replace(/\s/g,"").replace(",",".");var n=parseFloat(v);return isFinite(n)?n:NaN}
function fmt(n,maxd){if(!isFinite(n))return"";var d=maxd!=null?maxd:(Math.abs(n)>=100?0:2);return n.toLocaleString("ru-RU",{minimumFractionDigits:0,maximumFractionDigits:d})}

// Рыночный курс: встроенный → сохранённый → свежий из интернета
var market=load("fx_market",{TRY:49.00,RUB:84.41,date:"30.09.2026",src:"встроенный"});
var office=load("fx_office",{TRY:null,RUB:null});
var ids=["TRY","USD","RUB"],last="TRY";

function rate(c){if(c==="USD")return 1;return office[c]>0?office[c]:market[c]}

function recalc(src){
  var v=parse(el(src).value);
  ids.forEach(function(c){if(c!==src)el(c).value=isFinite(v)?fmt(v/rate(src)*rate(c)):""});
}
function render(){
  ["TRY","RUB"].forEach(function(c){
    el("m"+c).textContent=fmt(market[c],2);
    var useO=office[c]>0;
    el("m"+c).className="cell "+(useO?"off":"on");
    el("o"+c).className="cell "+(useO?"on":"");
  });
  el("stamp").textContent="Курс от "+market.date+(market.src?" · "+market.src:"");
  el("info").textContent="1 ₺ = "+fmt(rate("RUB")/rate("TRY"),2)+" ₽";
  el("resetO").style.visibility=(office.TRY>0||office.RUB>0)?"visible":"hidden";
  recalc(last);
}

function onOffice(c){
  var v=parse(el("o"+c).value);
  office[c]=v>0?v:null;store("fx_office",office);render();
}

async function fetchMarket(){
  var urls=[
    ["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json",function(j){return{TRY:j.usd.try,RUB:j.usd.rub,date:j.date}}],
    ["https://open.er-api.com/v6/latest/USD",function(j){return{TRY:j.rates.TRY,RUB:j.rates.RUB,date:null}}]
  ];
  for(var i=0;i<urls.length;i++){
    try{
      var r=await fetch(urls[i][0],{cache:"no-store"});if(!r.ok)continue;
      var d=urls[i][1](await r.json());
      if(d.TRY>0&&d.RUB>0){
        var dt=d.date?new Date(d.date):new Date();
        market={TRY:d.TRY,RUB:d.RUB,date:dt.toLocaleDateString("ru-RU"),src:"онлайн"};
        store("fx_market",market);render();return;
      }
    }catch(e){}
  }
}

ids.forEach(function(c){
  el(c).addEventListener("input",function(){last=c;recalc(c)});
  el(c).addEventListener("focus",function(){this.select()});
});
["TRY","RUB"].forEach(function(c){
  if(office[c]>0)el("o"+c).value=String(office[c]).replace(".",",");
  el("o"+c).addEventListener("input",function(){onOffice(c)});
});
document.querySelectorAll("[data-v]").forEach(function(b){
  b.addEventListener("click",function(){el("TRY").value=fmt(+b.dataset.v);last="TRY";recalc("TRY")});
});
el("clear").addEventListener("click",function(){ids.forEach(function(c){el(c).value=""})});
el("resetO").addEventListener("click",function(){office={TRY:null,RUB:null};el("oTRY").value="";el("oRUB").value="";store("fx_office",office);render()});

render();
if(navigator.onLine!==false)fetchMarket();
</script>
</body>
</html>
